name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Verify repository checkout
      run: |
        test -d .git
        test -n "$(git ls-files)"
    - name: List tracked files
      run: git ls-files
